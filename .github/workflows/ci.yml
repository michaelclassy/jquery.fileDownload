name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: JS syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify plugin loads (syntax check)
        run: node --check src/Scripts/jquery.fileDownload.js

      - name: Verify TypeScript definitions parse
        run: npx --yes -p typescript@5 tsc --noEmit --target es5 --types '' src/Scripts/jquery.fileDownload.d.ts || true
